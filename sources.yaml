# 欧洲智库源清单 (56 家, 抽自上传的 Excel)
#
# strategy 字段:
#   rss        - 走 RSS/Atom (优先, 最快最稳)
#   html_list  - 走列表页 + CSS 选择器
#   skip       - 暂不抓 (待补适配器)
#
# 优先级 12 家给了候选 RSS 地址，但是在被锁出网的容器里无法实测，
# 标了 verified: false。本地跑一次后可见到 404/403/解析失败就改回 skip 或换 html_list。
#
# 字段说明:
#   feeds         : list[str]，可多个 RSS 地址
#   list_url      : html_list 用的列表页 URL
#   item_selector : CSS 选择器, 每条产出对应一个节点
#   title/link/date_selector : 相对于 item 节点的子选择器
#   date_attr     : 日期来自属性 (如 <time datetime="…">) 时填属性名
#   base_url      : 相对链接拼接基址 (默认用 list_url)

sources:

